name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Reusable LLVM 23 install for Ubuntu runners.
# NOTE: history had `./llvm.sh 22` next to `llvm-23-dev` packages; the
# mismatch broke resolution. The script version and the package versions
# must both be 23.
x-llvm23-ubuntu: &llvm23-ubuntu
  run: |
    wget -q https://apt.llvm.org/llvm.sh
    chmod +x llvm.sh
    sudo ./llvm.sh 23
    sudo apt-get install -y llvm-23-dev libpolly-23-dev
    echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"

jobs:
  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # P1-O1 (production-readiness plan): 44 `// needs-llvm` fixtures
      # were silently Ignored on this job because GLYIM_LLVM was unset
      # (~18% of the corpus). This job already installs LLVM 23, so
      # running them is the honest choice; a pass means the flagship
      # backend is verified end-to-end, and a fail means we need to fix
      # something real. If any of these need to be excluded later, use a
      # per-fixture `// only-target` annotation, not a job-wide skip.
      GLYIM_LLVM: "1"
      # TEST-3: on *this* job both fixture needs are satisfiable —
      # `GLYIM_LLVM` is set above (covers `// needs-llvm`), and the
      # runner is `x86_64-unknown-linux-gnu` (covers every `// only-target`
      # in the tree). So an `Ignored` outcome here can only mean the
      # harness was misconfigured, and we want that to be a loud failure
      # rather than a silently-missing test. A fixture that legitimately
      # cannot run should be `// ignore`-annotated (structural), which this
      # flag deliberately does NOT promote. Other matrix jobs (macOS,
      # Windows) intentionally omit this flag: they genuinely lack LLVM,
      # so `Ignored` there is the truthful outcome, not a gap.
      GLYIM_TEST_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 23
        <<: *llvm23-ubuntu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        # §3.5.23: `GLYIM_LLVM=1` only *un-skips* `// needs-llvm`
        # fixtures; it does not enable the real LLVM backend. Without
        # `--features glyim-test/real-llvm`, `PipelineCompiler` falls
        # back to `MockCodegen` and every needs-llvm fixture runs under
        # the MIR interpreter — which panics on `ref`-patterns (10 of
        # the 12 fixtures that used to be red here). The same feature
        # is already passed by `test-differential` and `test-linux-runtime`.
        run: cargo nextest run --workspace --features glyim-test/real-llvm

  test-linux-runtime:
    name: M5 runtime proof — strict (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 23
        <<: *llvm23-ubuntu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: "Run M5 runtime fixtures (strict: real LLVM codegen + link + run)"
        # STRICT PATH: build the fixtures with the real LlvmBackend, link
        # them natively, execute them, and REQUIRE Passed. The harness
        # tolerates mock-codegen `CompilationFailed` only when
        # GLYIM_TEST_REAL_LLVM is unset; setting it (plus the `real-llvm`
        # feature) makes CompilationFailed a hard failure. The runtime.rs
        # header (2026-09-21) records that the fn_abi_of codegen gap is
        # closed, so this must stay green.
        env:
          GLYIM_TEST_REAL_LLVM: "1"
        run: cargo nextest run -p glyim-test --test runtime --features glyim-test/real-llvm

  test-differential:
    name: Differential — LLVM native vs MIR interpreter (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 23
        <<: *llvm23-ubuntu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Compile every run-pass fixture with both backends and compare
        # The project's strongest silent-miscompile detector: each run-pass
        # fixture is compiled once, executed natively (LLVM) and in the MIR
        # interpreter, and exit code + stdout must agree. Status at
        # commit 60452ca6: 0 disagreements. Any disagreement is a release
        # blocker, not a flake.
        env:
          GLYIM_TEST_REAL_LLVM: "1"
        run: cargo nextest run -p glyim-test --test differential --features glyim-test/real-llvm

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 23
        run: |
          brew install llvm@23
          echo "LLVM_SYS_231_PREFIX=$(brew --prefix llvm@23)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace

  test-windows:
    name: Test (windows-latest, runtime)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Build runtime
        run: cargo build -p glyim-runtime
      - name: Run runtime tests (verifies Windows process signaling, Phase 6.4)
        run: cargo nextest run -p glyim-runtime

  # P2-O6 (KNOWN_GAPS §8.4): MSRV gate.
  #
  # `rust-version = "1.85"` in the root `Cargo.toml` is a *promise*. Before
  # this job, nothing in CI checked it — a `cargo update` or a new
  # nightly-only language feature could land and silently break MSRV.
  #
  # `cargo check --workspace --all-targets` (not `cargo test`) is
  # intentional: MSRV is about "does this compile on the declared
  # minimum", and running the whole test suite on 1.85 would multiply
  # the runtime without adding MSRV coverage. `--all-targets` catches
  # MSRV regressions in test code too, not just in lib/bin crates.
  #
  # LLVM 23 is a hard dependency of the workspace (per README), so we
  # install it exactly like the other jobs. The `llvm.sh` installer
  # is independent of the Rust toolchain's version.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 23
        <<: *llvm23-ubuntu
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85
      - name: cargo check (MSRV 1.85)
        run: cargo check --workspace --all-targets
  miri-check:
    name: Miri (nightly, type/check crates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install Miri
        uses: taiki-e/install-action@miri
      - name: Run Miri on type-checking crates
        # Miri can't run LLVM-heavy crates; exercise the pure-Rust
        # analysis crates (glyim-type, glyim-borrowck, glyim-solve).
        run: |
          cargo miri test -p glyim-type
          cargo miri test -p glyim-borrowck
          cargo miri test -p glyim-solve

  lint:
    name: Format + Clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # This is the project's own quality bar (tools/glyim-pilot
        # ClippyGate: every warning fatal, workspace-wide).
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Warn-fallback heuristics
        # Previously orphaned script: fails if a `tracing::warn!` in the
        # hot crates is followed by a silent numeric/None fallback.
        run: bash .github/scripts/check-warn-fallbacks.sh

  supply-chain:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check

  dead-code-check:
    name: Dead-code burndown
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check for dead code in codegen crates
        # Warnings are printed AND made fatal for these two crates only,
        # so the job can actually fail (the old version could not).
        run: |
          cargo clippy -p glyim-codegen --all-targets -- -W dead_code -D warnings
          cargo clippy -p glyim-frontend --all-targets -- -W dead_code -D warnings

  # Appendix A §A10: report coverage and mutation scores without gating yet.
  # The thresholds (`tools/glyim-pilot/src/gates/{coverage,mutation}.rs`:
  # 80% lines, 75% kill rate) are the project's own bar, but neither has ever
  # been measured on CI. `continue-on-error` keeps them advisory until a
  # baseline is recorded and the numbers are known-good; flipping that to
  # `false` is the deliberate "harden the gate" step.
  #
  # `--lib` only: the integration corpus spawns `glyim-cli` as a subprocess,
  # and llvm-cov cannot attribute child-process coverage back to the parent,
  # so including tests/ would drag the number down with code that *is*
  # exercised (see the session-15 handoff note on the 48% artifact).
  coverage-report:
    name: Coverage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Measure line coverage
        run: |
          cargo llvm-cov --workspace --lib \
            --ignore-filename-regex '(tests?/|/build\.rs$)' \
            --summary-only | tee /tmp/cov.txt
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^TOTAL/p' /tmp/cov.txt >> "$GITHUB_STEP_SUMMARY"

  mutation-report:
    name: Mutation (advisory, sampled)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      # The whole workspace is far too slow for one CI job, so sample two
      # crates with dense pure logic and no LLVM dependency.
      - name: Measure mutation kill rate (glyim-type, glyim-solve)
        run: |
          cargo mutants -p glyim-type -p glyim-solve --no-times | tee /tmp/mut.txt || true
          echo "## Mutation" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'kill rate|mutants tested' /tmp/mut.txt >> "$GITHUB_STEP_SUMMARY" || true
