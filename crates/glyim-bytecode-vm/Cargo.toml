[package]
documentation = "https://glyim.vercel.app"

repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-bytecode-vm"
keywords = ["bytecode", "vm", "interpreter", "runtime", "compiler"]
license.workspace = true
version = "0.10.0"
edition = "2024"
description = "Switch-dispatch bytecode virtual machine for the Glyim bytecode backend (Phase 7 production-grade)"

# Module-image encode/decode bench (glyim.module-image/1; dependency-free,
# `harness = false` like the other request/timing benches in the workspace).
[[bench]]
name = "module_image"
harness = false

# Float-execution bench (the float seam: OP_LOAD_CONST_F64, (Float, Float)
# binop dispatch, FloatToInt casts; dependency-free, `harness = false`).
[[bench]]
name = "float_exec"
harness = false

# Module-disassembly bench (the disasm seam: render_module/render_function
# over a decoded fib+main module; dependency-free, `harness = false`).
[[bench]]
name = "module_disasm"
harness = false

# Execution-trace bench (the trace seam: untraced vs traced dispatch-loop
# overhead over a countdown loop, plus the captured-steps render;
# dependency-free, `harness = false`).
[[bench]]
name = "vm_trace"
harness = false

# Execution-profile bench (the profile seam: the aggregate fold's dispatch
# overhead vs the untraced baseline, the post-hoc `from_steps` fold over a
# captured transcript, and the deterministic render; dependency-free,
# `harness = false`).
[[bench]]
name = "vm_profile"
harness = false

# Fault-backtrace bench (the backtrace seam: the per-dispatch site-tracking
# baseline pair, the fault-path report capture, the deterministic render,
# and the deep-chain worst case; dependency-free, `harness = false`).
[[bench]]
name = "vm_backtrace"
harness = false

# Instruction-coverage bench (the coverage seam: the hit-map fold's dispatch
# overhead vs the untraced baseline, the post-hoc `from_steps` fold over a
# captured transcript, and the deterministic render; dependency-free,
# `harness = false`).
[[bench]]
name = "vm_coverage"
harness = false

# Local-watch bench (the watch seam: the per-write hook overhead vs the
# unwatched baseline over a store-heavy countdown loop, and the
# deterministic render; dependency-free, `harness = false`).
[[bench]]
name = "vm_watch"
harness = false

# Module-image diff bench (the diff seam: the identical fast path and the
# divergent render over two decoded golden modules; dependency-free,
# `harness = false`).
[[bench]]
name = "module_diff"
harness = false

# Call-graph bench (the callgraph seam: the per-call edge fold's dispatch
# overhead vs the untraced baseline over a call-heavy loop, the post-hoc
# `from_steps` fold over a captured transcript, and the deterministic
# render; dependency-free, `harness = false`).
[[bench]]
name = "vm_callgraph"
harness = false

# Run-diff bench (the rundiff seam: the identical pair's full scan, the
# early-divergence short circuit, and the render over captured
# transcripts; dependency-free, `harness = false`).
[[bench]]
name = "vm_run_diff"
harness = false

# Branch-history bench (the branches seam: the per-decision fold's dispatch
# overhead vs the untraced baseline over a branch-heavy loop, the post-hoc
# `from_steps` fold over a captured transcript, and the deterministic
# render; dependency-free, `harness = false`).
[[bench]]
name = "vm_branches"
harness = false

# Call-state bench (the state seam: the frame-boundary hook's overhead vs
# the unattached baseline over a call-heavy loop — one locals snapshot per
# frame enter and exit — and the deterministic render; dependency-free,
# `harness = false`).
[[bench]]
name = "vm_state"
harness = false

# Inclusive-cost bench (the cost seam: the per-dispatch inclusive/exclusive
# fold's dispatch overhead vs the untraced baseline over a call-heavy loop,
# the post-hoc `from_steps` fold over a captured transcript, and the
# deterministic render; dependency-free, `harness = false`).
[[bench]]
name = "vm_cost"
harness = false

# Tail-window bench (the window seam: the flight-recorder ring's dispatch
# overhead vs the untraced baseline over a countdown loop — one step clone
# plus one eviction per dispatch once the window is full — the post-hoc
# `from_tail` fold over a captured transcript, and the deterministic
# render; dependency-free, `harness = false`).
[[bench]]
name = "vm_window"
harness = false

[dependencies]
# The module-image seam (glyim.module-image/1) logs encode/decode events and
# every decode rejection through the workspace-standard tracing layer, so a
# mis-shipped image surfaces in the driver's subscriber output like the
# interpreter's unhandled-extern warning does.
tracing = { workspace = true }

[dev-dependencies]
glyim-core = { path = "../glyim-core" }
glyim-mir = { path = "../glyim-mir" }
glyim-type = { path = "../glyim-type" }
glyim-span = { path = "../glyim-span" }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
