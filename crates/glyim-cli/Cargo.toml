[package]
description = "The glyim-cli crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-cli"
keywords = ["cli", "compiler", "interpreter", "repl", "terminal"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-lang-std = { workspace = true }
glyim-db = { workspace = true }
glyim-pipeline = { workspace = true }
glyim-codegen-llvm = { workspace = true }
glyim-codegen = { workspace = true }
glyim-core = { workspace = true }
glyim-type = { workspace = true }
glyim-diag = { workspace = true }
glyim-proc-macro = { workspace = true }
# M2.4: `--emit=run` executes the compiled MIR through the canonical
# in-process program-run contract (`run_program`) shared with the test
# harness's `InterpRunner`.
glyim-mir-interp = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.27"
serde_json = { workspace = true }
[dev-dependencies]
glyim-test = { workspace = true }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
