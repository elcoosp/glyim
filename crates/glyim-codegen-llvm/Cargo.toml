[package]
name = "glyim-codegen-llvm"
license.workspace = true
edition.workspace = true
version.workspace = true

[features]
# Link llvm-sys against the shared libLLVM instead of the default static
# archives. Build with `--features glyim-codegen-llvm/prefer-dynamic` on
# memory-constrained hosts: statically linking every workspace test binary
# against libLLVM needs ~1.5 GB per `ld` invocation, which OOMs small
# machines. The default (static) is unchanged and is what CI uses.
prefer-dynamic = ["inkwell/llvm23-1-force-dynamic"]

[dependencies]
inkwell = { workspace = true, features = ["llvm23-1"] }
# Raw FFI bindings for the LLVM-C funclet (exception-handling) API, which
# inkwell does not wrap. Version must match the llvm-sys instance inkwell
# links (231.0.1) so the raw pointers resolve against the same libLLVM.
llvm-sys = "231"
glyim-codegen = { workspace = true }
glyim-mir = { workspace = true }
glyim-diag = { workspace = true }
glyim-core = { workspace = true }
glyim-type = { workspace = true }
glyim-layout = { workspace = true }
glyim-span = { workspace = true }
glyim-db = { workspace = true }
tracing = { workspace = true }
[dev-dependencies]
tempfile = "3"
glyim-core = { workspace = true }
glyim-test = { workspace = true }
