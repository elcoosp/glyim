[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-codegen crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-codegen"
keywords = ["codegen", "compiler", "llvm", "backend", "mir"]
license.workspace = true
version = "0.10.1"
edition = "2024"

[dependencies]
glyim-core = { workspace = true }
glyim-diag = { workspace = true }
glyim-mir = { workspace = true }
glyim-type = { workspace = true }
glyim-layout = { workspace = true }
glyim-span = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
glyim-bytecode-vm = { path = "../glyim-bytecode-vm" }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
