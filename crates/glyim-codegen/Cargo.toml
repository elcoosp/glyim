[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-codegen crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-codegen"
keywords = ["codegen", "compiler", "llvm", "backend", "mir"]
license.workspace = true
version = "0.10.0"
edition = "2024"

# Module-image assembly bench (generate_module_image; dependency-free,
# `harness = false` like the other timing benches in the workspace — the
# corpus is built from `glyim-test`'s blessed TyCtx, same as the crate's
# unit tests).
[[bench]]
name = "module_assembly"
harness = false

[dependencies]
glyim-core = { workspace = true }
glyim-diag = { workspace = true }
glyim-mir = { workspace = true }
glyim-type = { workspace = true }
glyim-layout = { workspace = true }
glyim-span = { workspace = true }
tracing = { workspace = true }
# The module-image assembly seam (`generate_module_image`): the emitter
# produces the loadable `glyim.module-image/1` container the VM crate
# defines, so its encoder becomes a regular dependency. The VM crate is
# dependency-free, so the edge stays acyclic.
glyim-bytecode-vm = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
glyim-bytecode-vm = { path = "../glyim-bytecode-vm" }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
