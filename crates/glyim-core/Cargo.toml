[package]
description = "The glyim-core crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-core"
keywords = ["compiler", "interpreter", "bytecode", "typeck", "borrowck"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
lasso = { workspace = true, features = ["multi-threaded"] }
smallvec = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
