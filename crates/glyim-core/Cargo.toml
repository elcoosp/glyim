[package]
documentation = "https://glyim.vercel.app"

description = "Foundation types: arena, primitives, def-id, ABI, interner, path."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-core"
keywords = ["compiler", "interpreter", "bytecode", "typeck", "borrowck"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
lasso = { workspace = true, features = ["multi-threaded"] }
smallvec = { workspace = true }

# M3.1 Round 2 baseline-unblock + M0.8 dead-weight: the `glyim-test`
# dev-dependency was never imported anywhere in src/tests/benches/examples
# (no `use glyim_test` / `glyim_test::` reference exists in the crate), yet it
# pulled the entire LLVM toolchain (glyim-test → glyim-pipeline →
# glyim-codegen-llvm → inkwell → llvm-sys 231) into `cargo test -p
# glyim-core --all-features`. glyim-core is the leaf foundation crate with no
# LLVM coupling. Dropping it makes the M3.1 local baseline gate green on
# LLVM-less hosts — the same unblock the M3.3 work applied to glyim-diag.
[lints]
workspace = true
