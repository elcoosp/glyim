[package]
documentation = "https://glyim.vercel.app"

description = "Compilation database: interners, VFS, type context, trait context."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-db"
keywords = ["database", "compiler", "incremental", "query", "salsa"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
sha2 = { workspace = true }
glyim-core = { workspace = true }
glyim-span = { workspace = true }
glyim-diag = { workspace = true }
glyim-vfs = { workspace = true }
glyim-type = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
glyim-test = { workspace = true }
# The M2.7 `set_mono_cache` clone-free pin (tests/mono_cache_alloc.rs)
# counts real allocation events through the harness's opt-in counting
# allocator (`counting_allocator!` is exported exactly for consumers to
# adopt it per binary). dev-only: glyim-bench does not depend on glyim-db,
# so no cycle exists.
glyim-bench = { path = "../../tools/glyim-bench" }

[[bench]]
name = "cache_metrics"
harness = false
path = "benches/cache_metrics.rs"

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
