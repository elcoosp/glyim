[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-diag crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-diag"
keywords = ["diagnostics", "error-reporting", "compiler", "lsp", "span"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-span = { workspace = true }
miette = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }

[[bench]]
name = "json_render"
harness = false
path = "benches/json_render.rs"

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
