[package]
documentation = "https://glyim.vercel.app"

description = "Diagnostic types and error reporting built on `miette`."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-diag"
keywords = ["diagnostics", "error-reporting", "compiler", "lsp", "span"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-span = { workspace = true }
miette = { workspace = true }
serde_json = { workspace = true }

# M3.1 Round 2 zero-warnings + M0.8 dead-weight: `tracing` was listed but
# never imported anywhere in src/tests/benches/examples (the only mentions
# are prose in a `lib.rs` doc comment); cargo flagged it as an unused
# dependency under `clippy --all-targets`. Dropping it closes that warning
# without touching any code. (The M3.3 cleanup below already removed the
# LLVM-pulling `glyim-test` dev-dependency for the same reason.)

# M3.3 micro-debt cleanup: the `glyim-test` dev-dependency was dead weight
# here — none of `src/`, `tests/`, `benches/`, or `examples/` imports it. It
# forced the entire LLVM toolchain (glyim-test → glyim-pipeline →
# glyim-codegen-llvm → inkwell → llvm-sys 231) into `cargo test -p
# glyim-diag`, even though glyim-diag is leaf-side of the type-safety
# refactor and is locally verifiable without LLVM (plan M3.3 DoD). Dropping
# it unblocks the M3.3 local baseline gate (cargo test -p glyim-diag) on
# hosts without LLVM 23 installed.

[[bench]]
name = "json_render"
harness = false
path = "benches/json_render.rs"

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
