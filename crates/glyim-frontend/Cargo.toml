[package]
description = "The glyim-frontend crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-frontend"
keywords = ["frontend", "parser", "lexer", "compiler", "ast"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
rowan = { workspace = true }
glyim-syntax = { workspace = true }
glyim-span = { workspace = true }
glyim-diag = { workspace = true }
smol_str = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
