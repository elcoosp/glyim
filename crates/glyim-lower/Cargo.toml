[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-lower crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-lower"
keywords = ["lowering", "compiler", "ast", "mir", "desugaring"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-layout = { workspace = true }
rowan = { workspace = true }
glyim-hir = { workspace = true }
glyim-syntax = { workspace = true }

glyim-core = { workspace = true }
glyim-type = { workspace = true }
glyim-mir = { workspace = true }
glyim-typeck = { workspace = true }
glyim-span = { workspace = true }
glyim-diag = { workspace = true }
glyim-const-eval = { workspace = true }
glyim-def-map = { workspace = true }
glyim-borrowck = { workspace = true }
fixedbitset = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
glyim-frontend = { workspace = true }
glyim-def-map = { workspace = true }
glyim-solve = { workspace = true }

# Dev dependencies for slice pattern tests
glyim-codegen-llvm = { workspace = true }
glyim-pipeline = { workspace = true }
tempfile = "3"
# glyim-const-eval = { workspace = true }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
