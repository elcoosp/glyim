[[bench]]
name = "document_highlight"
harness = false

# Semantic-tokens request bench (LSP-SEMANTIC-TOKENS; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "semantic_tokens"
harness = false

# Workspace-diagnostics request bench (LSP-WORKSPACE-DIAG;
# dependency-free, `harness = false` like the other request benches).
[[bench]]
name = "workspace_diagnostics"
harness = false

# Document-link request bench (LSP-DOC-LINK; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "document_link"
harness = false

# Linked-editing-range bench (LSP-LINKED-EDIT; dependency-free,
