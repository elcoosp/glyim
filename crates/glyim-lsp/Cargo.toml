[package]
documentation = "https://glyim.vercel.app"

repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-lsp"
keywords = ["lsp", "language-server", "compiler", "editor", "ide"]
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language Server Protocol implementation for Glyim"

[[bin]]
name = "glyim-lsp"
path = "src/bin/glyim-lsp.rs"

# Call-hierarchy request bench (LSP-CALL-HIERARCHY; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "call_hierarchy"
harness = false

# Signature-help request bench (LSP-SIGNATURE-HELP; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "signature_help"
harness = false

# Type-definition request bench (LSP-TYPE-DEF; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "type_definition"
harness = false

# Selection-range request bench (LSP-SELECTION; dependency-free,
# `harness = false` like the document_highlight bench).
[[bench]]
name = "selection_range"
harness = false

# Document-highlight request bench (LSP-HIGHLIGHT; dependency-free,
# `harness = false` like the glyim-diag/glyim-ledger benches).
[[bench]]
name = "document_highlight"
harness = false

# Semantic-tokens request bench (LSP-SEMANTIC-TOKENS; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "semantic_tokens"
harness = false

[dependencies]
notify = "8.2"
# `crossbeam-channel` and `file_url` were declared here but never imported
# anywhere in the crate (cargo's unused-dependency lint flagged both);
# removed with the LSP-CALL-HIERARCHY pass so the manifest reflects the
# actual dependency set.
glyim-db = { path = "../glyim-db" }
glyim-hir = { path = "../glyim-hir" }
glyim-diag = { path = "../glyim-diag" }
glyim-syntax = { path = "../glyim-syntax" }
glyim-frontend = { path = "../glyim-frontend" }
glyim-core = { path = "../glyim-core" }
glyim-span = { path = "../glyim-span" }
async-lsp = { git = "https://github.com/elcoosp/async-lsp", features = ["omni-trait", "stdio", "tokio"] }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
dashmap = "6.2"
parking_lot = "0.13"
# LSP-SELECTION: the parse-tree walk needs rowan's TokenAtOffset/TextSize
# API directly (glyim-syntax re-exports only the node/green types).
rowan = { workspace = true }
url = "2.5.8"
glyim-def-map = { workspace = true }
glyim-type = { workspace = true }
glyim-typeck = { workspace = true }
glyim-solve = { workspace = true }

lsp-types = "0.97.0"
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
glyim-test = { workspace = true }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
