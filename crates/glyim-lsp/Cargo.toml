[package]
documentation = "https://glyim.vercel.app"

repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-lsp"
keywords = ["lsp", "language-server", "compiler", "editor", "ide"]
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language Server Protocol implementation for Glyim"

[[bin]]
name = "glyim-lsp"
path = "src/bin/glyim-lsp.rs"

# Call-hierarchy request bench (LSP-CALL-HIERARCHY; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "call_hierarchy"
harness = false

# Code-lens request bench (LSP-CODE-LENS; dependency-free, `harness =
# false` like the other request benches).
[[bench]]
name = "code_lens"
harness = false

# On-type-formatting request bench (LSP-ON-TYPE-FORMAT; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "on_type_formatting"
harness = false

# Type-hierarchy request bench (LSP-TYPE-HIERARCHY; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "type_hierarchy"
harness = false

# Execute-command request bench (LSP-EXEC-CMD; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "execute_command"
harness = false

# Signature-help request bench (LSP-SIGNATURE-HELP; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "signature_help"
harness = false

# Inlay-hint request bench (LSP-INLAY-HINT; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "inlay_hint"
harness = false

# Goto-declaration request bench (LSP-DECLARATION; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "goto_declaration"
harness = false

# Server-log bench (LSP-LOG-FILE; dependency-free, `harness = false`
# like the other request benches).
[[bench]]
name = "server_log"
harness = false

# Type-definition request bench (LSP-TYPE-DEF; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "type_definition"
harness = false

# Implementation-request bench (LSP-IMPLEMENTATION; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "implementation"
harness = false

# Pull-diagnostics bench (LSP-PULL-DIAG; dependency-free, `harness = false`
# like the other request benches).
[[bench]]
name = "document_diagnostics"
harness = false

# Selection-range request bench (LSP-SELECTION; dependency-free,
