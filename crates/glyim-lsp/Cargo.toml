# Range-formatting request bench (LSP-RANGE-FORMAT; dependency-free,
# `harness = false` like the other request benches).
[[bench]]
name = "range_formatting"
harness = false

[dependencies]
notify = "8.2"
# `crossbeam-channel` and `file_url` were declared here but never imported
# anywhere in the crate (cargo's unused-dependency lint flagged both);
# removed with the LSP-CALL-HIERARCHY pass so the manifest reflects the
# actual dependency set.
glyim-db = { path = "../glyim-db" }
glyim-hir = { path = "../glyim-hir" }
glyim-diag = { path = "../glyim-diag" }
glyim-syntax = { path = "../glyim-syntax" }
glyim-frontend = { path = "../glyim-frontend" }
glyim-core = { path = "../glyim-core" }
glyim-span = { path = "../glyim-span" }
async-lsp = { git = "https://github.com/elcoosp/async-lsp", features = ["omni-trait", "stdio", "tokio"] }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
# LSP-LOG-FILE: the --log-file seam installs a JSON-lines tracing
# subscriber over a file writer; the workspace dep already carries the
# `json` feature the format needs.
tracing-subscriber = { workspace = true }
dashmap = "6.2"
parking_lot = "0.13"
# LSP-SELECTION: the parse-tree walk needs rowan's TokenAtOffset/TextSize
# API directly (glyim-syntax re-exports only the node/green types).
rowan = { workspace = true }
url = "2.5.8"
glyim-def-map = { workspace = true }
glyim-type = { workspace = true }
glyim-typeck = { workspace = true }
glyim-solve = { workspace = true }

lsp-types = "0.97.0"
# LSP-CODE-LENS: the `CodeLens.data` resolve payload is a wire-contract
# JSON value (lsp-types carries `serde_json::Value`), and the resolve
# builds the command arguments out of the same type.
serde_json = { workspace = true }
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
glyim-test = { workspace = true }
# LSP-LOG-FILE: the log-file tests write into throwaway directories.
tempfile = { workspace = true }
# JSON round-trips in the tests (server-log probes, semantic-token wire
# shape): production code stopped needing it when the dead external-
# diagnostics cluster went away (LSP-DEAD-EXTERNAL-DIAG).
serde_json = "1.0"
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
