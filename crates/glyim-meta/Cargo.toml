[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-meta crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-meta"
keywords = ["meta", "compiler", "macro", "reflection", "proc-macro"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
rowan = { workspace = true }
glyim-core = { workspace = true }
smol_str = { workspace = true }
glyim-span = { workspace = true }
glyim-syntax = { workspace = true }
glyim-diag = { workspace = true }
tracing = { workspace = true }
glyim-frontend = { workspace = true }
glyim-vfs = { workspace = true }
glyim-proc-macro = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
tempfile = "3.27"
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
