[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-mir-interp crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-mir-interp"
keywords = ["mir", "interpreter", "compiler", "vm", "runtime"]
license.workspace = true
version = "0.10.1"
edition = "2024"

[dependencies]
glyim-core = { workspace = true }
glyim-mir = { workspace = true }
glyim-type = { workspace = true }
glyim-layout = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }

glyim-span = { workspace = true }

# M2.4: the process-contract bench (`run_program` per-run cost), in the
# repo's dependency-free `harness = false` shape — see benches/run_program.rs.
[[bench]]
name = "run_program"
harness = false
path = "benches/run_program.rs"

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
