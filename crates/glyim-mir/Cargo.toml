[package]
documentation = "https://glyim.vercel.app"

description = "Mid-level IR (CFG), place types, statement/terminator kinds."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-mir"
keywords = ["mir", "compiler", "codegen", "intermediate-repr", "lowering"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-core = { workspace = true }
glyim-span = { workspace = true }
glyim-type = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }

# Dependency-free cost harness for the inline binary-op operand payload
# (plan PF-12 / M2.7 quick win) — see `benches/binary_op_inline.rs`.
[[bench]]
name = "binary_op_inline"
harness = false

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
