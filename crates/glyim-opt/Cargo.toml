[package]
name = "glyim-opt"
keywords = ["optimization", "compiler", "mir", "codegen", "passes"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-span = { workspace = true }
glyim-type = { workspace = true }
glyim-mir = { workspace = true }
glyim-core = { workspace = true }

tracing = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
glyim-mir-interp = { workspace = true }

# Opt-level pass-plan cost harness (dependency-free, like the
# glyim-type/glyim-pipeline benches).
[[bench]]
name = "pass_plans"
harness = false

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
