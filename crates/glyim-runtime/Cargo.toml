[package]
documentation = "https://glyim.vercel.app"

description = "Runtime FFI: alloc, dealloc, drop glue, panic, fs/net/thread."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-runtime"
keywords = ["runtime", "interpreter", "vm", "language", "compiler"]
license.workspace = true
edition.workspace = true
version.workspace = true

# `staticlib` produces `libglyim_runtime.a` for `--emit=exec` linking.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
socket2 = "0.6"
libc = "0.2"
mio = { version = "1.2", features = ["net", "os-poll"] }
glyim-core = { workspace = true }

# Windows-only process/console plumbing (the runtime probe's handle
# cleanup, the crash-diagnostics walk). Scoped to the target so the
# Linux/macOS builds do not carry (or get warned about) a dependency
# their cfg gates compile out.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
libc = "0.2"
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
