[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-solve crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-solve"
keywords = ["solver", "type-system", "compiler", "inference", "typeck"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-core = { workspace = true }
glyim-type = { workspace = true }
glyim-diag = { workspace = true }
glyim-span = { workspace = true }
tracing = { workspace = true }


[dev-dependencies]
glyim-test = { workspace = true }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
