[package]
documentation = "https://glyim.vercel.app"

description = "Trait solver and type-inference engine (unification, HRTB)."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-solve"
keywords = ["solver", "type-system", "compiler", "inference", "typeck"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-core = { workspace = true }
glyim-type = { workspace = true }
glyim-diag = { workspace = true }
glyim-span = { workspace = true }
tracing = { workspace = true }


[dev-dependencies]
glyim-test = { workspace = true }
# M3.10 "property tests for foundations": the `InferenceTable` unification
# laws (reflexivity, symmetry, var binding, occurs check) are property-
# tested here.
proptest = { workspace = true }
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
