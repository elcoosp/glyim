[package]
documentation = "https://glyim.vercel.app"

description = "Source locations, hygiene context, multi-span for diagnostics."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-span"
keywords = ["span", "source-code", "compiler", "diagnostics", "ast"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-core = { workspace = true }
miette = { workspace = true }
# M3.1 Round 2 baseline-unblock + M0.8 dead-weight: `tracing` was listed but
# never imported anywhere in src/tests/benches/examples (cargo flagged it as
# an unused dependency), and the `glyim-test` dev-dependency was dead weight
# that pulled the entire LLVM toolchain (glyim-test → glyim-pipeline →
# glyim-codegen-llvm → inkwell → llvm-sys 231) into `cargo test -p
# glyim-span --all-features`, even though glyim-span is a leaf frontend crate
# with no LLVM coupling. Dropping both makes the M3.1 local baseline gate
# (`cargo test -p glyim-span --all-features`) green on LLVM-less hosts, the
# same unblock the M3.3 work applied to glyim-diag. No src/tests/benches/
# examples file referenced either dependency.
[dev-dependencies]
# M3.2 DoD "Span invariants proptested": the `(lo, len)` representation
# invariants are property-tested here (the same `proptest` the pilot gate
# already pins at 1.12, so the lockfile carries no new version surface).
proptest = "1.12"

# M3.2 construction bench: the CT-3 invariant checks must stay negligible
# next to parsing; the bench tracks the per-span cost of the checked
# constructors (see `benches/span_ctor.rs`).
[[bench]]
name = "span_ctor"
harness = false

[lints]
workspace = true
