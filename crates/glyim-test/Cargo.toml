[package]
name = "glyim-test"
edition.workspace = true
version.workspace = true

[features]
default = []
json-output = ["serde", "serde_json"]
# Real LLVM backend for the `runtime` integration test. When enabled, the
# `PipelineCompiler` harness produces a real native object (via
# `glyim-codegen-llvm`), links it, and executes it — turning the M5 fixtures
# into a true Linux runtime proof instead of a mock-codegen no-op. Only the
# `test-linux-runtime` CI job enables this (it sets LLVM_SYS_220_PREFIX and
# GLYIM_TEST_REAL_LLVM).
#
# NOTE (2026-08-28): the native async codegen path is currently broken (the
# `LlvmBackend` panics in `fn_abi_of` for the monomorphized `block_on<F>` /
# `poll` types), so these fixtures currently FAIL on the Linux job. That is the
# intended strict behavior: the job now surfaces the gap instead of passing by
# tolerance. Fixing the async codegen gap will make this job green.
real-llvm = ["glyim-codegen-llvm"]

[dependencies]
glyim-mir-interp = { workspace = true }
glyim-core       = { workspace = true }
glyim-span       = { workspace = true }
glyim-diag       = { workspace = true }
glyim-vfs        = { workspace = true }
glyim-syntax     = { workspace = true }
glyim-frontend   = { workspace = true }
glyim-def-map    = { workspace = true }
glyim-type       = { workspace = true }
glyim-hir        = { workspace = true }
glyim-mir        = { workspace = true }
glyim-solve      = { workspace = true }
glyim-typeck     = { workspace = true }
glyim-lower      = { workspace = true }
glyim-borrowck   = { workspace = true }
glyim-codegen    = { workspace = true }
glyim-codegen-llvm = { workspace = true, optional = true }
glyim-db         = { workspace = true }
glyim-pipeline   = { workspace = true }
glyim-cli        = { workspace = true }
glyim-meta       = { workspace = true }
glyim-proc-macro = { workspace = true }
glyim-layout     = { workspace = true }
glyim-opt        = { workspace = true }
insta            = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot      = { workspace = true }
rayon            = { workspace = true }
similar          = "3"
termcolor        = "1.4"
walkdir          = "2"
regex            = "1"
shell-words      = "1.1"
rand             = "0.10"
serde            = { version = "1.0", optional = true }
serde_json       = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"