[package]
description = "The glyim-type crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-type"
keywords = ["type-system", "typeck", "compiler", "inference", "solver"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-core = { workspace = true }
glyim-span = { workspace = true }
indexmap = { workspace = true }
smallvec = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }


[dev-dependencies]
glyim-test = { workspace = true }

[[bench]]
name = "builtin_trait_registry"
harness = false
path = "benches/builtin_trait_registry.rs"

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
