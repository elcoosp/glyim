[package]
documentation = "https://glyim.vercel.app"

description = "Core type system and Type Context (TyCtx)."
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-type"
keywords = ["type-system", "typeck", "compiler", "inference", "solver"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-core = { workspace = true }
glyim-span = { workspace = true }
# M3.4 "safe append-only arena": the three interner tables (types, flags,
# substitution data) live in this vetted, loom-tested append-only vector —
# entries never move, `&self` push/get is lock-free, storage is freed when
# the arena drops. Replaces the `Box::into_raw` tables + `unsafe impl
# Send/Sync` + `unsafe` `Drop` the old design needed (glyim-type now
# contains zero `unsafe`).
boxcar = { workspace = true }
smallvec = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }


[dev-dependencies]
glyim-test = { workspace = true }
# M3.10 "property tests for foundations": the `Substitution` interning,
# `subst_ty` rewrite and the symbol mangler are property-tested here.
proptest = { workspace = true }

[[bench]]
name = "builtin_trait_registry"
harness = false
path = "benches/builtin_trait_registry.rs"

[[bench]]
name = "type_arena"
harness = false
path = "benches/type_arena.rs"

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
