[package]
documentation = "https://glyim.vercel.app"

description = "The glyim-vfs crate for the glyim ecosystem"
repository = "https://github.com/elcoosp/glyim"
readme = "../../README.md"
name = "glyim-vfs"
keywords = ["vfs", "virtual-filesystem", "compiler", "lsp", "parser"]
license.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
glyim-span = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
glyim-test = { workspace = true }
tempfile = "3.27"
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
