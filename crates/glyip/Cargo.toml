[package]
name = "glyip"
license.workspace = true
version.workspace = true
edition.workspace = true
description = "Cargo-like build tool for the Glyim compiler"

[[bin]]
name = "glyip"
path = "src/bin/glyip.rs"

[features]
registry = ["reqwest", "flate2", "tar"]
default = ["registry"]
# P2-A7 (KNOWN_GAPS §8.1): removed the dead `llvm = []` feature. It was
# declared but never referenced by any `cfg(feature = "llvm")` — the
# codegen backend is a non-optional dependency (`glyim-codegen-llvm`).
# The only mention of the string in the codebase was a *comment* in
# `commands.rs:715` noting that the old `#[cfg(feature = "llvm")]` gate
# was removed. Keeping a `--features llvm` in the manifest that has no
# effect is a foot-gun: users could enable it and expect LLVM codegen.

[dependencies]
semver = { workspace = true }
glyim-type = { workspace = true }
glyim-core = { workspace = true }
glyim-mir = { workspace = true }
glyim-mir-interp = { workspace = true }
glyim-def-map = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
glyim-diag = { workspace = true }
glyim-pipeline = { workspace = true }
glyim-db = { workspace = true }
glyim-codegen = { workspace = true }
glyim-codegen-llvm = { workspace = true }
glyim-cli = { workspace = true }
glyim-vfs = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde_json = "1"
hex = "0.4"
[dev-dependencies]
glyim-test = { workspace = true }
tempfile = { workspace = true }
