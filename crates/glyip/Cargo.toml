[package]
name = "glyip"
version = "0.1.0"
edition = "2024"
description = "Cargo-like build tool for the Glyim compiler"

[[bin]]
name = "glyip"
path = "src/bin/glyip.rs"

[features]
registry = ["reqwest", "flate2", "tar"]
llvm = []
default = ["registry"]

[dependencies]
semver = { workspace = true }
glyim-type = { workspace = true }
glyim-core = { workspace = true }
glyim-mir = { workspace = true }
glyim-mir-interp = { workspace = true }
glyim-def-map = { workspace = true }
reqwest = { version = "0.13", features = ["blocking", "json"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
glyim-diag = { workspace = true }
glyim-pipeline = { workspace = true }
glyim-db = { workspace = true }
glyim-codegen = { workspace = true }
glyim-codegen-llvm = { workspace = true }
glyim-cli = { workspace = true }
glyim-vfs = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde_json = "1"
hex = "0.4"
[dev-dependencies]
glyim-test = { workspace = true }
tempfile = { workspace = true }
