# M1.2 feature registry seed — `runtime/ffi.toml`.
#
# M1.3 inventory claims: every `runtime.ffi.*` key below is extracted
# from `crates/glyim-runtime/src` by `ledger inventory` (plan §3.5);
# `ledger check` fails when a symbol exists without a claim here or an
# entry in `ledger/inventory-ignore.toml`. RUNTIME-FFI-SYNC claims
# nothing: no mutex/rwlock symbols exist in the runtime yet, so that
# declared family stays unbacked until its symbols land.

# Curated from the documented inventory (README feature list + language
# tour, docs/specs, docs/design/*) per docs/roadmaps/glyim-master-plan.md
# M1.2. Entries are declarations only: no status fields (plan C1); levels
# are computed from evidence by `ledger compute` (M1.8).

[[feature]]
id            = "RUNTIME-FFI-ALLOC"
title         = "`glyim_alloc`/`glyim_dealloc` allocator entry points"
area          = "runtime.ffi"
tier          = "std"
spec          = "README.md"
target_level  = "L4"
backends      = ["gam", "llvm"]
             inventory = [
                 "runtime.ffi.glyim_alloc",
                 "runtime.ffi.glyim_dealloc",
             ]
             owner_lane    = "B"

