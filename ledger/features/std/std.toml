# M1.2 feature registry seed — `std/std.toml`.
#
# Curated from the documented inventory (README feature list + language
# tour, docs/specs, docs/design/*) per docs/roadmaps/glyim-master-plan.md
# M1.2. Entries are declarations only: no status fields (plan C1); levels
# are computed from evidence by `ledger compute` (M1.8).

[[feature]]
id            = "STD-STD-ENV"
title         = "`env` module: environment variables, args, cwd, home (24 fns)"
area          = "std.std"
tier          = "std"
spec          = "README.md"
target_level  = "L4"
backends      = ["gam", "llvm"]
owner_lane    = "B"
inventory    = [
    "stdlib.std.env.CONSTS",
    "stdlib.std.env.HomeDirError",
    "stdlib.std.env.OS_SEPARATOR",
    "stdlib.std.env.OsConsts",
    "stdlib.std.env.args",
    "stdlib.std.env.current_dir",
    "stdlib.std.env.current_exe",
    "stdlib.std.env.home_dir",
    "stdlib.std.env.is_unix",
    "stdlib.std.env.is_windows",
    "stdlib.std.env.remove_var",
    "stdlib.std.env.set_current_dir",
    "stdlib.std.env.set_var",
    "stdlib.std.env.temp_dir",
    "stdlib.std.env.var",
    "stdlib.std.env.vars",
]

