area          = "tooling.bench"
tier          = "tooling"
spec          = "README.md"
target_level  = "L4"
backends      = ["gam", "llvm"]
requires      = []
owner_lane    = "B"

[[feature]]
id            = "TOOL-BENCH-STABILITY-GATE"
title         = "CoV stability gate (< 0.1 % over 10 runs) with typed, help-annotated failure"
