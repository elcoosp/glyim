# Seed gap registry (M1.1) — migrated from KNOWN_GAPS.md §§1–2 in spirit;
# the M1.7 migration slice landed in `0002-known-gaps-migration.toml`
# (KNOWN_GAPS §§4/§6 entries GAP-0003..GAP-0005 with the GAP-0004 witness).
#
# GAP-0001 (`.await` inside a loop body rejected, T0060) closed here: the
# `for`-over-range shape its witness pinned desugars to a resumable
# `Start`/`S0`/`Done` machine since the loop-await `for` normalization, the
# witness retired into `tests/run-pass/behavior/async_for_loop_await.g`,
# and the remaining loop shapes re-registered as GAP-0006 in
# `0003-await-loop-shapes.toml` (with its own strict-xfail witness).
#
# M3.3(c): GAP-0002 witness landed. The gap is Windows-SEH-shaped in its
# title, but the *observable* behaviour — no lowering site sets cleanup
# edges, so a panic exits 101 without running destructors — is
# cross-platform. The witness
# `crates/glyim-test/tests/run-fail/behavior/seh_cleanup_edges_unreachable_known_gap.g`
# pins that observable on Linux: a `Pair` with a `Drop` impl that is in
# scope when `panic!` fires must NOT have its destructor run, so the
# `DROPS` counter stays `0` (printed before the panic) and the exit code
# is `101`. When cleanup edges land, `Pair::drop` runs, the counter
# becomes `1`, and the fixture fails with `known-gap GAP-0002 closed`
# (strict xfail, plan §3.3). This retires the witness debt for GAP-0002.

[[gap]]
id        = "GAP-0002"
class     = "b"
title     = "Windows SEH cleanup edges are unreachable: no lowering site sets cleanup (panic exits 101)"
affects   = ["LANG-UNWIND-CLEANUP"]
caps      = "L2"
opened_in = "v0.3.0"
status    = "witnessed"
witness   = "crates/glyim-test/tests/run-fail/behavior/seh_cleanup_edges_unreachable_known_gap.g"

