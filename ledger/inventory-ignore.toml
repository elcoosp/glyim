# M1.3 inventory ignore registry (plan §3.5): items extracted from
# source that deliberately have no claiming feature. Keys are exact —
# no globs — so a NEW MIR variant can never be silently swallowed:
# it fails `ledger check` until it is claimed or ignored with a
# reason. The seed ignores are the 29 existing glyim-mir IR variants
# across StatementKind/Rvalue/Operand/ProjectionElem/TerminatorKind;
# per-variant backend-parity rows become the §3.6 matrix once the
# ledger-trace counters and M1.8 evidence land.

