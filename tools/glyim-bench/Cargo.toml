[package]
name = "glyim-bench"
version = "0.10.0"
edition = "2024"
description = "M2.2 measurement harness: instruction counts (perf stat / callgrind), wall time, child RSS, a counting allocator, and the CoV stability gate"
publish = false

[dependencies]
clap = { workspace = true }
# `getrusage(RUSAGE_CHILDREN)` for the child RSS column; already in the
# dependency graph transitively, promoted to a direct dependency here.
libc = "0.2"
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The M2.6 budgets seam loads the committed `glyim.bench-budgets/1` TOML
# document (the waivers-loader precedent in glyim-ledger's diff slice).
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lib]
name = "glyim_bench"
path = "src/lib.rs"

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "glyim-bench"
path = "src/main.rs"

[[bench]]
name = "runner_overhead"
harness = false
path = "benches/runner_overhead.rs"

[[bench]]
name = "corpus_gen"
harness = false
path = "benches/corpus_gen.rs"

[[bench]]
name = "diff_engine"
harness = false
path = "benches/diff_engine.rs"

[[bench]]
name = "scaling_engine"
harness = false
path = "benches/scaling_engine.rs"

[[bench]]
name = "budget_engine"
harness = false
path = "benches/budget_engine.rs"

[[bench]]
name = "history_store"
harness = false
path = "benches/history_store.rs"

[[bench]]
name = "matrix_engine"
harness = false
path = "benches/matrix_engine.rs"

[[bench]]
name = "trend_engine"
harness = false
path = "benches/trend_engine.rs"

[[bench]]
name = "corpus_dir"
harness = false
path = "benches/corpus_dir.rs"

# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
