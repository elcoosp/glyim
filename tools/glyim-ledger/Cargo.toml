[package]
name = "glyim-ledger"
version = "0.10.0"
edition = "2024"
description = "M1.1 Readiness Ledger CLI: `check` registry gate, `gaps` witness report (M1.7) + `gaps witness` write face, `next` work queue + `explain` (§3.7/§3.9), `compute` level engine (M1.8), `status`/`render-gaps` renderers (M1.9), `diff` regression gate (M1.10), `gates` release-gate report (M1.12), `verify` determinism self-check (M1.13), `evidence record`/`evidence check`/`evidence audit` store curation (§3.4), `waivers` C9 waiver-health report + `waivers grant`/`waivers revoke`/`waivers extend`/`waivers prune` write faces, `handoff` session-handoff generator (§3.7), `release-check` final release gate (§10), `inventory`, and JSON-Schema export"
publish = false

[dependencies]
ledger-schema = { path = "../ledger-schema" }
# Fixture-bytes digesting for the `evidence audit` face: the recomputed
# `fixture_sha256` is what the drift verdict compares against (the same
# hex spelling the harness evidence emitter records).
sha2 = { workspace = true }
# Typed CLI errors (`LedgerCliError`) with `help()` — the same diagnostic
# seam `glyim-test` uses for evidence/fixture-header failures.
miette = { workspace = true }
serde_json = "1.0"
# `Serialize` on the `next` work-queue items: the plan §3.9 JSON contract
# (`glyim.ledger-next/1`) consumed by `glyim-pilot`.
serde = { workspace = true }
# The M1.10 `ledger/waivers.toml` loader (the same TOML face `load_policy`
# uses for `ledger/policy.toml`).
toml = { workspace = true }
# `next`-queue and `gaps`-report spans — the same instrumentation seam the
# bench harness and the test executor use; a no-op unless a subscriber is
# installed.
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.27"

[lib]
name = "glyim_ledger"
path = "src/lib.rs"

[[bin]]
name = "glyim-ledger"
path = "src/main.rs"

[[bench]]
name = "gap_report"
harness = false
path = "benches/gap_report.rs"

[[bench]]
name = "next_queue"
harness = false
path = "benches/next_queue.rs"

[[bench]]
name = "compute"
harness = false
path = "benches/compute.rs"

[[bench]]
name = "status"
harness = false
path = "benches/status.rs"

[[bench]]
name = "diff"
harness = false
path = "benches/diff.rs"

[[bench]]
