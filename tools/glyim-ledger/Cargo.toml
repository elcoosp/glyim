[package]
name = "glyim-ledger"
version = "0.9.0"
edition = "2024"
description = "M1.1 Readiness Ledger CLI: `check` registry gate, `gaps` witness report (M1.7), `next` work queue + `explain` (§3.7/§3.9), `inventory`, and JSON-Schema export"
publish = false

[dependencies]
ledger-schema = { path = "../ledger-schema" }
# Typed CLI errors (`LedgerCliError`) with `help()` — the same diagnostic
# seam `glyim-test` uses for evidence/fixture-header failures.
miette = { workspace = true }
serde_json = "1.0"
# `Serialize` on the `next` work-queue items: the plan §3.9 JSON contract
# (`glyim.ledger-next/1`) consumed by `glyim-pilot`.
serde = { workspace = true }
# `next`-queue and `gaps`-report spans — the same instrumentation seam the
# bench harness and the test executor use; a no-op unless a subscriber is
# installed.
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.27"

[lib]
name = "glyim_ledger"
path = "src/lib.rs"

[[bin]]
name = "glyim-ledger"
path = "src/main.rs"

[[bench]]
name = "gap_report"
harness = false
path = "benches/gap_report.rs"

[[bench]]
name = "next_queue"
harness = false
path = "benches/next_queue.rs"

[lints]
workspace = true
