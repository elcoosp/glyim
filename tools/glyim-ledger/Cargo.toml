harness = false
path = "benches/verify.rs"

[[bench]]
name = "render"
harness = false
path = "benches/render.rs"

[[bench]]
name = "evidence"
harness = false
path = "benches/evidence.rs"

[[bench]]
name = "waivers"
harness = false
