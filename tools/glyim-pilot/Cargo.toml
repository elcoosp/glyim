[package]
name = "glyim-pilot"
publish = false
version = "0.10.1"
edition = "2021"
description = "Autonomous AI agent dispatch for Glyim compiler development"
license = "MIT"

[[bin]]
name = "glyim-pilot"
path = "src/main.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.13", features = ["json"] }
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"
tokio-tungstenite = "0.30"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
comfy-table = "8"
chrono = { version = "0.4", features = ["serde"] }
path-clean = "1"
dunce = "1"
walkdir = "2"
ignore = "0.4"
strip-ansi-escapes = "0.2"
uuid = { version = "1", features = ["v4"] }
prometheus = { version = "0.14", optional = true }

[dev-dependencies]
proptest = "1.12"
tempfile = "3"
tokio-test = "0.4"
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"

[features]
default = []
prometheus = ["dep:prometheus"]
# Inherit the workspace lint set (missing_docs + clippy::pedantic baseline).
[lints]
workspace = true
